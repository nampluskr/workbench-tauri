<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebRTC Leak Test</title>
</head>
<body>
  <h1>WebRTC Leak Test</h1>
  <div id="status">Testing...</div>
  <pre id="candidates"></pre>
  <pre id="errors"></pre>
  <script>
    (async () => {
      const candidates = [];
      const errors = [];
      const statusEl = document.getElementById("status");
      const candEl = document.getElementById("candidates");
      const errEl = document.getElementById("errors");

      try {
        if (typeof RTCPeerConnection === "undefined") {
          statusEl.textContent = "RTCPeerConnection undefined (blocked)";
          return;
        }

        const pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });

        pc.onicecandidate = (e) => {
          if (e.candidate) {
            candidates.push(e.candidate.candidate);
            candEl.textContent = candidates.join("\n");
          } else {
            statusEl.textContent = "ICE Gathering Complete";
          }
        };

        pc.onicecandidateerror = (e) => {
          errors.push(`ICE Error: ${e.errorCode} ${e.errorText} (${e.url})`);
          errEl.textContent = errors.join("\n");
        };

        pc.createDataChannel("leak-test");
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        statusEl.textContent = "Offer created and set";
      } catch (err) {
        errors.push("Catch: " + (err.message || String(err)));
        errEl.textContent = errors.join("\n");
        statusEl.textContent = "Error occurred";
      }
    })();
  </script>
</body>
</html>
