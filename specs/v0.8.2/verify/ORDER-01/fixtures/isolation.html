<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>isolation</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>I-7 isolation</h1>
<p id="ran">inline script did NOT run</p>
<p id="localjs">local.js did NOT run</p>
<p class="local-css">local CSS (dashed border), local image: <img src="pic.png" alt="pic.png missing" width="32" height="32"></p>
<p>"blocked" means the page could not reach the app. "REACHED" means isolation failed.</p>
<table><thead><tr><th>attempt</th><th>result</th><th>detail</th></tr></thead><tbody id="rows"></tbody></table>
<script src="local.js"></script>
<script>
document.getElementById("ran").textContent = "inline script ran";
const rows = document.getElementById("rows");
function row(name, reached, detail) {
  const tr = rows.insertRow();
  tr.insertCell().textContent = name;
  const c = tr.insertCell();
  c.textContent = reached ? "REACHED" : "blocked";
  c.className = reached ? "bad" : "ok";
  tr.insertCell().textContent = String(detail);
}
function sync(name, fn) {
  try {
    const v = fn();
    row(name, v !== undefined && v !== null, v === undefined ? "undefined" : v === null ? "null" : typeof v);
  } catch (e) { row(name, false, e.name + ": " + e.message); }
}
async function later(name, fn) {
  try { row(name, true, await fn()); } catch (e) { row(name, false, (e && e.name) + ": " + (e && e.message)); }
}
sync("window.parent.document", () => window.parent.document);
sync("window.top.document", () => window.top.document);
sync("window.parent.location.href", () => window.parent.location.href);
sync("localStorage", () => localStorage);
sync("sessionStorage", () => sessionStorage);
sync("indexedDB.open", () => indexedDB.open("x"));
sync("document.cookie (write and read)", () => { document.cookie = "a=1"; return document.cookie || undefined; });
sync("window.__TAURI__", () => window.__TAURI__);
sync("window.__TAURI_INTERNALS__ (present)", () => window.__TAURI_INTERNALS__);
sync("window.ipc (present)", () => window.ipc);
sync("window.chrome.webview (present)", () => window.chrome && window.chrome.webview);
later("fetch ipc://localhost/about_info", () => fetch("ipc://localhost/about_info", { method: "POST", body: "{}" }).then((r) => "status " + r.status));
later("fetch http://ipc.localhost/about_info", () => fetch("http://ipc.localhost/about_info", { method: "POST", body: "{}" }).then((r) => "status " + r.status));
later("__TAURI_INTERNALS__.invoke('about_info')", () => {
  if (!window.__TAURI_INTERNALS__) throw new Error("not present");
  const timeout = new Promise((_, no) => setTimeout(() => no(new Error("no answer in 3 s")), 3000));
  return Promise.race([window.__TAURI_INTERNALS__.invoke("about_info").then((v) => JSON.stringify(v)), timeout]);
});
later("chrome.webview.postMessage", () => {
  if (!(window.chrome && window.chrome.webview)) throw new Error("not present");
  window.chrome.webview.postMessage("{}");
  throw new Error("sent, no answer channel (check the app log)");
});
</script>
</body></html>
