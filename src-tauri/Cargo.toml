[package]
name = "workbench-tauri"
edition = "2021"
rust-version = "1.90"

[lib]
name = "workbench_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
encoding_rs = "=0.8.44"
ignore = "=0.4.34"
notify = "=8.2.1"
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
trash = "=5.2.9"
# 03-tauri 3.1 "Win32 호출": maximize-button hit test for the snap layout flyout (D-6 step 2, R-3).
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Storage_FileSystem",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
