[package]
name = "workbench-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "workbench_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
notify = "=8.2.1"
tauri = { version = "=2.12.5", features = [] }
# 03-tauri 3.1 "Win32 호출": maximize-button hit test for the snap layout flyout (D-6 step 2, R-3).
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
