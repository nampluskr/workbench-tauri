# zed-metrics.toml — Zed 실측 수치 기준 스펙
# 소유: spec (spec/zed-metrics.toml)
# 규칙: 코드에 수치를 직접 하드코딩하지 않고 이 파일의 스펙 항목 ID로 참조한다.
# 수치 기준: docs/refs/01-zed/ (커밋 14b7b0e)

# ==============================================================================
# 측정 조건 (Conditions)
# ==============================================================================

[conditions.reference_mocha]
name = "Catppuccin Mocha 기준 화면 (노트북)"
screen_size = "2880x1704"
scale_factor = 2.0
dpi = 192
theme = "Catppuccin Mocha"
icon_theme = "Catppuccin Latte"
ui_font_size = 16
buffer_font_size = 15
maximized = true
note = "배율 2.0(DPI 192)은 타이틀 바 64 물리 px 관찰로 역산한 가정치이며 Windows 설정으로 확인하지 않음 (01-LAYOUT 1절, 04-APP-SPEC A-30.1)"
src = "01-LAYOUT 1절"

[conditions.reference_latte]
name = "Catppuccin Latte 기준 화면 (노트북, 비최대화)"
screen_size = "2448x1480"
scale_factor = 2.0
dpi = 192
theme = "Catppuccin Latte"
icon_theme = "Catppuccin Latte"
ui_font_size = 16
buffer_font_size = 15
maximized = false
note = "배율 2.0(DPI 192)은 타이틀 바 64 물리 px 관찰로 역산한 가정치이며 Windows 설정으로 확인하지 않음 (01-LAYOUT 1절, 04-APP-SPEC A-30.1)"
src = "01-LAYOUT 1.1절, L-310"

[conditions.default]
name = "Zed 기본 논리 환경 (Default)"
scale_factor = 1.0
density = "Default (1.0)"
ui_font_size = 16
buffer_font_size = 15
src = "01-LAYOUT 2절, L-01~L-04"

[conditions.window_unmaximized]
name = "클라이언트 장식 및 비최대화 창 (비tiled 변)"
decorations = "client"
maximized = false
tiled_edges = "none"
src = "01-LAYOUT 3절 L-311"

[conditions.project_panel_comfortable]
name = "프로젝트 패널 (간격 comfortable)"
density = "comfortable"
src = "01-LAYOUT 4.3절 L-36"

[conditions.project_panel_standard]
name = "프로젝트 패널 (간격 standard)"
density = "standard"
src = "01-LAYOUT 4.3절 L-36"

[conditions.focus_follows_mouse]
name = "마우스 포커스 이동 설정 활성화 시"
setting = "focus_follows_mouse.enabled=true"
src = "02-INTERACTION 6절 I-103"

[conditions.theme_token_fallback]
name = "테마 토큰 누락 또는 null 시 대체 (fallback_themes::zed_default_dark)"
trigger = "missing_or_null"
fallback_theme = "zed_default_dark"
src = "03-THEME-ICONS 1.2절 T-26"

[conditions.reference_image_200]
name = "기준 화면 이미지 캡처 (200% 배율, 1 물리 px = 0.5 논리 px)"
scale_factor = 2.0
unit_conversion = "1 physical px = 0.5 logical px"
src = "04-APP-SPEC 7.1절 A-30.2"

[conditions.desktop_measure_100]
name = "데스크톱 Zed 화면 실측 (v0.5 V3)"
screen_size = "1920x1080"
scale_factor = 1.0
dpi = 96
zed_build = "4304dec732a75505066de5ce2dbbfb2bec369498 (이 PC 설치본)"
note = "원문 01-LAYOUT의 커밋(14b7b0e)과 Zed 빌드가 다르다. 앱 클라이언트 1440x852"
src = "specs/v0.5/verify/reviews/measure-ORDER-07.md 1절"

